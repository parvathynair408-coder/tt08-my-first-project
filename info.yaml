yaml_version: 6

project:
  title:        "SPI Master Controller"
  author:       "Parvathy Nair Karippanal"
  discord:      ""
  description:  "A configurable SPI Master Controller for ASIC physical design."
  language:     "Verilog"
  clock_hz:     50000000
  tiles:        "1x1"
  top_module:   "tt_um_example"
  source_files:
    - "tt_um_example.v"

# Pinout mapping
pinout:
  ui[0]: "tx_data[0]"
  ui[1]: "tx_data[1]"
  ui[2]: "tx_data[2]"
  ui[3]: "tx_data[3]"
  ui[4]: "tx_data[4]"
  ui[5]: "tx_data[5]"
  ui[6]: "tx_data[6]"
  ui[7]: "tx_data[7]"
  uo[0]: "sclk"
  uo[1]: "mosi"
  uo[2]: "cs_n"
  uo[3]: "busy"
  uo[4]: "rx_data[0]"
  uo[5]: "rx_data[1]"
  uo[6]: "rx_data[2]"
  uo[7]: "rx_data[3]"
  uio[0]: "miso"
  uio[1]: "none"
  uio[2]: "none"
  uio[3]: "none"
  uio[4]: "none"
  uio[5]: "none"
  uio[6]: "none"
  uio[7]: "none"
